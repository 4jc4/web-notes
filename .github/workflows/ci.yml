name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync OpenAPI contract
        run: npm run api:sync

      - name: Generate API client
        run: npx orval --config orval.config.ts

      - name: Fail if generated client is out of date
        run: |
          if ! git diff --exit-code -- src/generated; then
            echo "::error::src/generated/ está desatualizado em relação ao contrato OpenAPI publicado. Rode 'npm run api:generate' e commite o resultado."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # `next build` já roda o type-check completo do projeto (fase
      # "Running TypeScript" do próprio Next). Um `tsc --noEmit`
      # separado antes do build falharia: tipos como `LayoutProps`
      # só existem em `.next/types/`, gerado pelo próprio build.
      - name: Build
        run: npm run build

  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
